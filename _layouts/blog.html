---
layout: default
---

<header class="site-header site-header--compact measure">
  <nav class="site-nav measure" aria-label="Primary">
    <a href="{{ '/' | relative_url }}">index</a>
    {% if site.data.home.navbar_entries %}
      {% for item in site.data.home.navbar_entries %}
        <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
      {% endfor %}
    {% endif %}
    <a href="{{ '/feed.xml' | relative_url }}">rss</a>
    {% include social_links.html %}
  </nav>
  <h1 class="site-title site-title--sm">{{ site.title }}</h1>
</header>

<main id="main" class="site-main measure">
  {% include post_list.html %}
</main>
