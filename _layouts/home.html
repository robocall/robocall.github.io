---
layout: default
---

<header class="site-header site-header--home measure">
  {% if site.data.home.navbar_entries %}
    <nav class="site-nav site-nav--header-top measure" aria-label="Primary">
      {% for item in site.data.home.navbar_entries %}
        <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
      {% endfor %}
      <a href="{{ '/feed.xml' | relative_url }}">rss</a>
      {% include social_links.html %}
    </nav>
  {% endif %}
  <div class="site-header__top">
    <h1 class="site-title">
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </h1>
  </div>
</header>

<main id="main" class="site-main measure">
  {{ content }}
  <section class="log" aria-labelledby="log-heading">
    <h2 id="log-heading" class="site-prompt log-prompt">
      <span class="site-prompt__user">jj</span><span class="site-prompt__at">@</span><span class="site-prompt__host">hostname</span><span class="site-prompt__path">:~/blog</span><span class="site-prompt__sym">$</span>
      <span class="site-prompt__cmd">ls -l</span>
    </h2>
    {% include post_list.html %}
  </section>
</main>
