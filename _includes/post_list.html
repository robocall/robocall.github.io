{% assign df = site.date_format | default: "%Y-%m-%d" %}
{% if site.posts.size > 0 %}
  <ol class="post-log">
    {% for post in site.posts %}
      <li class="post-log__row">
        <span class="post-log__date">{{ post.date | date: df }}</span>
        <a class="post-log__link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
      </li>
    {% endfor %}
  </ol>
{% endif %}
