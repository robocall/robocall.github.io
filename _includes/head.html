<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>
    {% if page.title %}
      {{ page.title }} · {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  {% seo title=false %}
  {% feed_meta %}

  {% assign _favicon = '/slashlogo.png' | relative_url %}
  <link rel="icon" href="{{ _favicon }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ _favicon }}">
  <link rel="manifest" href="{{ '/assets/images/favicon/site.webmanifest' | relative_url }}">
  <link rel="mask-icon" href="{{ '/assets/images/favicon/safari-pinned-tab.svg' | relative_url }}" color="#0b0d12">
  <link rel="shortcut icon" href="{{ _favicon }}">
  <meta name="msapplication-TileColor" content="#0b0d12">
  <meta name="msapplication-config" content="{{ '/assets/images/favicon/browserconfig.xml' | relative_url }}">
  <meta name="theme-color" content="#0b0d12">

  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}" />
  {%- include custom_head.html -%}
</head>
